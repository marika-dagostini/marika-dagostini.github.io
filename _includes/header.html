<header class="navbar masthead">
  <div class="container masthead-bar">
    <a class="wordmark" href="{{ site.url }}{{ site.baseurl }}/" aria-label="{{ site.name | escape }}, home">
      <img src="{{ site.url }}{{ site.baseurl }}/favicon.svg" width="28" height="28" alt="">
      <span>{{ site.name | escape }}</span>
    </a>

    <button class="nav-toggle collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">Menu</button>

    <nav class="collapse navbar-collapse nav-links" id="navbarNav" aria-label="Main">
      <ul>
        <li>
          <a class="nav-link{% if page.url == '/' %} active{% endif %}" href="{{ site.url }}{{ site.baseurl }}/"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
        </li>
        {% for nav in site.nav_pages %}
        <li>
          <a class="nav-link{% if page.url contains nav.name %} active{% endif %}" href="{{ site.url }}{{ site.baseurl }}/{{ nav.name }}"{% if page.url contains nav.name %} aria-current="page"{% endif %}>{{ nav.name | capitalize }}</a>
        </li>
        {% endfor %}
      </ul>
      <div class="nav-tools">
        <button type="button" class="search-toggle icon-btn" id="searchToggle" aria-label="Search site">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        </button>
        {% if site.dark_mode %}
        <button type="button" class="dark-mode-toggle icon-btn" id="darkModeToggle" aria-label="Toggle dark mode">
          <i class="fa-solid fa-sun" id="themeIcon" aria-hidden="true"></i>
        </button>
        {% endif %}
      </div>
    </nav>
  </div>
  <div class="container"><hr class="rule--double"></div>
</header>

<!-- Search overlay -->
<div class="search-overlay" id="searchOverlay">
  <div class="search-modal" role="dialog" aria-label="Search pages">
    <div class="search-input-wrapper">
      <i class="fa-solid fa-magnifying-glass search-input-icon" aria-hidden="true"></i>
      <input type="text" class="search-input" id="searchInput" placeholder="Search pages" autocomplete="off" aria-label="Search pages">
      <kbd class="search-kbd">Esc</kbd>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>
</div>
